<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Entrenamiento Microsoft 365 corporativo con Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink2:#2F4A7A; --paper:#F6F4EF; --paper2:#EAE6DC; --card:#FFFDF8;
  --line:#D5CFC2; --muted:#4A5568; --soft:#6B7280; --acc:#D9622B; --acc-d:#B8501F; --acc-l:#FBE3D5;
  --ok:#1F6F4A; --ok-l:#E2F1E8; --bad:#A3362A; --bad-l:#F8E3DF; --blue:#2F6FB0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Public Sans',Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:'Space Grotesk',Arial,sans-serif;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside.nav{background:var(--ink);color:var(--paper);padding:24px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;line-height:1.2}
.brand small{display:block;font-family:'Public Sans',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.5px;color:#F2A477;margin-bottom:6px}
.prog{margin:20px 0 18px}
.bar{height:8px;background:#2F4A7A;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
.prog p{margin:6px 0 0;font-size:13px;color:#C9D2E3}
.nav ul{list-style:none;margin:0;padding:0}
.nav li button{width:100%;text-align:left;background:none;border:0;color:#E3E8F2;padding:9px 10px;border-radius:8px;display:flex;gap:10px;align-items:center;font-size:14.5px}
.nav li button:hover{background:#22325A}
.nav li button.on{background:#2F4A7A;color:#fff}
.dot{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #5A6E96;display:grid;place-items:center;font-size:12px;font-weight:700}
.done .dot{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.sep{height:1px;background:#2F4A7A;margin:12px 0}
main{padding:40px 56px 80px;max-width:1080px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--acc-d);text-transform:uppercase}
.lead{font-size:18px;color:var(--muted);max-width:760px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 26px}
.pill{background:var(--paper2);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.pill b{color:var(--acc-d)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 16px}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px}
.num{width:40px;height:40px;border-radius:10px;background:var(--paper2);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:18px}
.step.ok .num{background:var(--ok);color:#fff}
.step h3{font-size:19px;margin-bottom:6px}
.where{font-size:13.5px;color:var(--soft);margin:2px 0 8px}
.where code{background:var(--paper2);padding:1px 6px;border-radius:4px;font-size:13px;color:var(--ink)}
.step p{margin:6px 0}
.prompt{background:var(--ink);color:#F6F4EF;border-radius:10px;padding:12px 14px;margin:10px 0;font-family:'Courier New',monospace;font-size:14px;white-space:pre-wrap;position:relative;padding-right:78px}
.copy{position:absolute;top:8px;right:8px;background:#2F4A7A;color:#fff;border:0;border-radius:6px;padding:3px 10px;font-family:'Public Sans';font-size:12px}
.check{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600}
.step.ok .check{background:var(--ok-l);border-color:#9CCBB2;color:var(--ok)}
.tip{background:var(--acc-l);border-left:5px solid var(--acc);border-radius:10px;padding:14px 18px;margin:20px 0}
.tip b{color:var(--acc-d)}
.sales{background:#E7EEF8;border-left:5px solid var(--blue);border-radius:10px;padding:14px 18px;margin:20px 0}
h2.sec{font-size:24px;margin:32px 0 14px}
.q{margin-bottom:18px}
.q p.qt{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:6px 0;font-size:15px;color:var(--ink)}
.opt:hover{border-color:var(--ink2)}
.opt.right{background:var(--ok-l);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-l);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.fb{font-size:14px;margin-top:6px;color:var(--muted)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700}
.btn.acc{background:var(--acc);color:var(--ink)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;color:var(--ink)}
.mod:hover{border-color:var(--ink2)}
.mod .n{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--acc-d)}
.mod h3{font-size:18px;margin:4px 0 6px}
.mod p{margin:0;font-size:14px;color:var(--muted)}
.mod .st{margin-top:10px;font-size:13px;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.no{background:var(--paper2);color:var(--soft)}
.score{font-family:'Space Grotesk';font-size:56px;font-weight:700}
.cert{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:40px;text-align:center;margin-top:20px}
.cert h2{font-size:34px;margin:10px 0}
.cert .who{font-family:'Space Grotesk';font-size:30px;color:var(--acc-d);margin:12px 0}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;min-width:280px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--paper2)}
.menu-btn{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside.nav{position:fixed;left:0;top:0;width:290px;z-index:20;transform:translateX(-100%);transition:transform .25s}
  aside.nav.open{transform:none}
  main{padding:72px 20px 60px}
  .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:30;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
}
/* Niveles de Copilot */
.lv{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:1px;border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.lv.t{background:var(--ok-l);color:var(--ok)}
.lv.b{background:#DCE6F4;color:#1F4E86}
.lv.p{background:var(--acc);color:var(--ink)}
.lv.rb{background:#1F4E86;color:#fff}
.alt{background:#F1F5FB;border:1px dashed #9BB3D6;border-radius:10px;padding:10px 14px;margin:10px 0 4px;font-size:14.5px}
.alt b{color:#1F4E86}
details.alt summary{cursor:pointer;font-weight:600;color:#1F4E86}
.nivel{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:20px 24px;margin:0 0 16px}
.nivel .row{margin-top:10px}
.btn.sel{outline:3px solid var(--acc);outline-offset:2px}
.navlv{margin:-6px 0 16px;font-size:13px;color:#C9D2E3}
.navlv button{background:none;border:0;color:#F2A477;text-decoration:underline;padding:0;font-size:13px}
</style>
</head>
<body>
<button class="menu-btn" id="menuBtn">☰ Módulos</button>
<div class="app">
<aside class="nav" id="nav">
  <div class="brand"><small>ECOSISTEMA MICROSOFT 365</small>Microsoft 365 corporativo · entrenamiento paso a paso</div>
  <div class="prog"><div class="bar"><i id="barFill"></i></div><p id="progTxt">0 de 10 módulos</p></div>
  <p class="navlv" id="navLv"></p>
  <ul id="navList"></ul>
</aside>
<main id="main"></main>
</div>

// Reordena las opciones de forma estable para que la respuesta correcta no caiga siempre en el mismo lugar.
(function(){
  function seed(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
  function rng(s){ return function(){ s=(s+0x6D2B79F5)|0; let t=Math.imul(s^(s>>>15),1|s); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  MODS.forEach(m=>m.quiz.forEach(q=>{
    const r = rng(seed(q.q)); const idx = q.o.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    const correct = q.o[q.a]; q.o = idx.map(i=>q.o[i]); q.a = q.o.indexOf(correct);
  }));
})();

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isPro = () => S.nivel === "pro";
const nivelTxt = () => S.nivel==="pro" ? "Pro" : (S.nivel==="basico" ? "Básica" : "Básica (sin confirmar)");

function stepsDone(m){ return m.steps.filter((_,i)=>S.steps[m.id+"-"+i]).length; }
function quizOk(m){ const r = S.quiz[m.id]; return r && r.correct === m.quiz.length; }
function modDone(m){ return stepsDone(m) === m.steps.length && quizOk(m); }
function countLv(m){ const c={t:0,b:0,p:0}; m.steps.forEach(s=>c[s.n]++); return c; }

function renderNav(route){
  const done = MODS.filter(modDone).length;
  $("#barFill").style.width = (done*10)+"%";
  $("#progTxt").textContent = done + " de 10 módulos completos" + (S.exam && S.exam.pass ? " · certificado" : "");
  $("#navLv").innerHTML = `Ruta: <b>${nivelTxt()}</b> · <button data-go="inicio">cambiar</button>`;
  let h = `<li><button data-go="inicio" class="${route==='inicio'?'on':''}"><span class="dot">⌂</span>Inicio</button></li><div class="sep"></div>`;
  MODS.forEach(m=>{
    h += `<li class="${modDone(m)?'done':''}"><button data-go="modulo-${m.id}" class="${route==='modulo-'+m.id?'on':''}"><span class="dot">${modDone(m)?'✓':m.id}</span>${esc(m.title)}</button></li>`;
  });
  h += `<div class="sep"></div><li class="${S.exam&&S.exam.pass?'done':''}"><button data-go="examen" class="${route==='examen'?'on':''}"><span class="dot">★</span>Examen final y certificado</button></li>`;
  $("#navList").innerHTML = h;
}

function nivelCard(){
  return `<div class="nivel"><h3 style="font-size:19px;margin-bottom:6px">¿Qué Copilot tienes?</h3>
  <p style="margin:4px 0">Entra a <b>copilot.cloud.microsoft</b> con tu cuenta de la empresa y mira la etiqueta debajo de tu nombre. Nueve de cada diez participantes tienen el básico: todo el programa está diseñado para que lo aproveches al máximo.</p>
  <div class="row"><button class="btn ${S.nivel==='basico'?'acc sel':'ghost'}" data-nivel="basico">Básico · «Copilot Chat (Basic)» o «M365 Copilot (Basic)»</button>
  <button class="btn ${S.nivel==='pro'?'acc sel':'ghost'}" data-nivel="pro">Pro · «M365 Copilot (Premium)»</button></div>
  <p style="margin:10px 0 0;font-size:14px;color:var(--soft)">${S.nivel?`Vas por la ruta <b>${nivelTxt()}</b>. Puedes cambiarla cuando quieras; tu avance se conserva.`:'Mientras no elijas, verás la ruta Básica.'}</p></div>`;
}

function home(){
  const done = MODS.filter(modDone).length;
  let h = `<p class="eyebrow">Ecosistema Microsoft 365 · entrenamiento corporativo</p>
  <h1 style="font-size:40px;margin:8px 0 12px">Domina Microsoft 365 corporativo, paso a paso</h1>
  <p class="lead">Diez módulos prácticos para operar tu trabajo con clientes dentro de la cuenta de tu empresa: del sitio del equipo en SharePoint a un flujo de Power Automate que trabaja por ti. Pensado para el Copilot básico que ya tienes, con ruta Pro para quien tenga licencia.</p>
  <div class="meta"><span class="pill"><b>${done}/10</b> módulos completos</span><span class="pill">Unas 7 horas de práctica</span><span class="pill">Examen final de 30 preguntas · aprobación 80 %</span></div>
  ${nivelCard()}
  <div class="card"><h3 style="font-size:19px;margin-bottom:8px">Cómo funciona</h3>
  <p style="margin:4px 0">1. Elige tu ruta arriba. Cada paso lleva una marca: <span class="lv t">SIN IA</span> lo hace cualquiera, <span class="lv b">COPILOT BÁSICO</span> funciona con el Copilot incluido y <span class="lv p">PRO</span> requiere licencia; en esos pasos la ruta Básica te muestra cómo lograr lo mismo.</p>
  <p style="margin:4px 0">2. Sigue cada paso en tu cuenta corporativa (o en la cuenta de práctica) y marca <b>Hecho</b> al terminar.</p>
  <p style="margin:4px 0">3. Responde las tres preguntas de control. El módulo se completa con todos los pasos hechos y las tres respuestas correctas.</p>
  <p style="margin:4px 0">4. Al terminar, presenta el examen final y obtén tu certificado.</p>
  <p style="margin:8px 0 0;font-size:14px;color:var(--soft)">Tu progreso se guarda en este navegador. Información verificada a octubre de 2026: las funciones de Microsoft cambian cada mes y algunas dependen de tu licencia, del tamaño de tu empresa y de tu administrador.</p></div>
  <h2 class="sec">Módulos</h2><div class="grid">`;
  MODS.forEach(m=>{
    const sd = stepsDone(m);
    h += `<button class="mod" data-go="modulo-${m.id}"><div class="n">MÓDULO ${m.id} · ${esc(m.time)}</div><h3>${esc(m.title)}</h3><p>${esc(m.short)}</p>
    <div class="st">${modDone(m)?'<span class="badge ok">Completo</span>':`<span class="badge no">${sd}/${m.steps.length} pasos${quizOk(m)?' · control ok':''}</span>`}</div></button>`;
  });
  h += `</div>`;
  return h;
}

function promptBox(p){ return p?`<div class="prompt"><button class="copy" data-copy="${esc(p)}">Copiar</button>${esc(p)}</div>`:''; }

function stepBody(s){
  if(s.n!=="p"){
    const lab = s.n==="t" ? '<span class="lv t">SIN IA · TODOS</span>' : '<span class="lv b">COPILOT BÁSICO</span>';
    return `<h3>${lab}${esc(s.t)}</h3><div class="where">Dónde: <code>${esc(s.w)}</code></div>${promptBox(s.p)}<p>${esc(s.d)}</p>`;
  }
  if(isPro()){
    return `<h3><span class="lv p">PRO</span>${esc(s.t)}</h3><div class="where">Dónde: <code>${esc(s.w)}</code></div>${promptBox(s.p)}<p>${esc(s.d)}</p>
    <details class="alt"><summary>Ruta básica (para ayudar a un compañero)</summary><div class="where" style="margin-top:8px">Dónde: <code>${esc(s.b.w)}</code></div>${promptBox(s.b.p)}<p style="margin:6px 0 0">${esc(s.b.d)}</p></details>`;
  }
  return `<h3><span class="lv rb">RUTA BÁSICA</span>${esc(s.t)}</h3><div class="where">Dónde: <code>${esc(s.b.w)}</code></div>${promptBox(s.b.p)}<p>${esc(s.b.d)}</p>
  <div class="alt"><b>Con licencia Pro:</b> ${esc(s.w)}. ${esc(s.d)}</div>`;
}

function moduleView(m){
  const qr = S.quiz[m.id] || {answers:{}};
  const c = countLv(m);
  let h = `<p class="eyebrow">Módulo ${m.id} de 10 · ruta ${nivelTxt()}</p><h1 style="font-size:36px;margin:8px 0 10px">${esc(m.title)}</h1>
  <p class="lead">${esc(m.goal)}</p>
  <div class="meta"><span class="pill">⏱ ${esc(m.time)}</span><span class="pill">Apps: ${esc(m.apps)}</span><span class="pill">Plan: ${esc(m.edition)}</span><span class="pill"><b>${stepsDone(m)}/${m.steps.length}</b> pasos</span><span class="pill">${c.t+c.b} con el básico${c.p?` · ${c.p} con ruta Pro`:''}</span></div>
  ${S.nivel?'':`<div class="tip"><b>Elige tu ruta.</b> Aún no marcaste si tu Copilot es Básico o Pro; te mostramos la ruta Básica. <button class="btn ghost" style="padding:6px 12px;margin-left:6px" data-go="inicio">Elegir ahora</button></div>`}
  <h2 class="sec">Paso a paso</h2>`;
  m.steps.forEach((s,i)=>{
    const k = m.id+"-"+i, ok = !!S.steps[k];
    h += `<div class="card step ${ok?'ok':''}"><div class="num">${ok?'✓':i+1}</div><div>
      ${stepBody(s)}
      <button class="check" data-step="${k}">${ok?'✓ Hecho':'Marcar como hecho'}</button>
    </div></div>`;
  });
  h += `<div class="tip"><b>Consejo clave.</b> ${esc(m.tip)}</div>
  <div class="sales"><b>Aplícalo a tu trabajo.</b> ${esc(m.sales)}</div>
  <h2 class="sec">Control del módulo</h2>`;
  m.quiz.forEach((q,qi)=>{
    const ans = qr.answers ? qr.answers[qi] : undefined;
    h += `<div class="card q"><p class="qt">${qi+1}. ${esc(q.q)}</p>`;
    q.o.forEach((o,oi)=>{
      let cls = "";
      if(ans!==undefined){ if(oi===q.a) cls="right"; else if(oi===ans) cls="wrong"; }
      h += `<button class="opt ${cls}" data-mq="${m.id}|${qi}|${oi}" ${ans!==undefined?'disabled':''}>${esc(o)}</button>`;
    });
    if(ans!==undefined) h += `<p class="fb">${ans===q.a?'✓ Correcto.':'✗ No es esa.'} ${esc(q.e)}</p>`;
    h += `</div>`;
  });
  const answered = qr.answers ? Object.keys(qr.answers).length : 0;
  if(answered===m.quiz.length && !quizOk(m)) h += `<div class="row" style="margin-bottom:16px"><button class="btn ghost" data-retry="${m.id}">Intentar el control de nuevo</button></div>`;
  h += `<div class="row" style="margin-top:24px">`;
  if(m.id>1) h += `<button class="btn ghost" data-go="modulo-${m.id-1}">← Módulo ${m.id-1}</button>`;
  h += m.id<10 ? `<button class="btn acc" data-go="modulo-${m.id+1}">Siguiente: módulo ${m.id+1} →</button>` : `<button class="btn acc" data-go="examen">Ir al examen final →</button>`;
  h += `</div>`;
  if(modDone(m)) h = `<div class="tip" style="background:var(--ok-l);border-color:var(--ok)"><b style="color:var(--ok)">Módulo completo.</b> Todos los pasos hechos y control aprobado.</div>` + h;
  return h;
}

// ---------- examen ----------
let EX = null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newExam(){
  const pool = [];
  MODS.forEach(m=>m.quiz.forEach(q=>pool.push(Object.assign({mod:m.id},q))));
  EX = {qs:shuffle(pool), answers:{}, finished:false};
}
function examView(){
  const done = MODS.filter(modDone).length;
  if(S.exam && S.exam.pass && !EX) return certView();
  if(!EX) newExam();
  let h = `<p class="eyebrow">Evaluación</p><h1 style="font-size:36px;margin:8px 0 10px">Examen final</h1>
  <p class="lead">30 preguntas sobre los diez módulos, en orden aleatorio. Necesitas 24 correctas (80 %) para obtener el certificado.</p>`;
  if(done<10) h += `<div class="tip"><b>Recomendación.</b> Llevas ${done} de 10 módulos completos. Puedes presentar el examen, pero te irá mejor si terminas primero los módulos.</div>`;
  if(EX.finished){
    const c = EX.qs.filter((q,i)=>EX.answers[i]===q.a).length;
    const pass = c>=24;
    h += `<div class="card" style="text-align:center"><div class="score">${c}/30</div><p style="font-size:18px">${pass?'¡Aprobado! Ya puedes generar tu certificado.':'Aún no alcanzas el 80 %. Repasa los módulos marcados abajo y vuelve a intentarlo.'}</p>
    <div class="row" style="justify-content:center">${pass?'<button class="btn acc" data-cert="1">Ver mi certificado</button>':''}<button class="btn ghost" data-newexam="1">Presentar de nuevo</button></div></div>`;
    const weak = {};
    EX.qs.forEach((q,i)=>{ if(EX.answers[i]!==q.a) weak[q.mod]=(weak[q.mod]||0)+1; });
    const wk = Object.keys(weak);
    if(wk.length) h += `<div class="card"><h3 style="font-size:18px;margin-bottom:8px">Módulos para repasar</h3>${wk.map(k=>`<button class="btn ghost" style="margin:4px" data-go="modulo-${k}">Módulo ${k}: ${esc(MODS[k-1].title)} (${weak[k]} errores)</button>`).join('')}</div>`;
    return h;
  }
  EX.qs.forEach((q,qi)=>{
    const ans = EX.answers[qi];
    h += `<div class="card q"><p class="qt">${qi+1}. ${esc(q.q)}</p>`;
    q.o.forEach((o,oi)=>{
      let cls = "";
      if(ans!==undefined){ if(oi===q.a) cls="right"; else if(oi===ans) cls="wrong"; }
      h += `<button class="opt ${cls}" data-eq="${qi}|${oi}" ${ans!==undefined?'disabled':''}>${esc(o)}</button>`;
    });
    if(ans!==undefined) h += `<p class="fb">${ans===q.a?'✓ Correcto.':'✗ No es esa.'} ${esc(q.e)}</p>`;
    h += `</div>`;
  });
  const n = Object.keys(EX.answers).length;
  h += `<div class="row"><button class="btn acc" data-finish="1" ${n<30?'disabled style="opacity:.5"':''}>Ver resultado (${n}/30 respondidas)</button></div>`;
  return h;
}
function certView(){
  const sc = S.exam ? S.exam.score : 0;
  const date = S.exam ? S.exam.date : "";
  return `<p class="eyebrow">Certificado</p><h1 style="font-size:36px;margin:8px 0 10px">Tu certificado</h1>
  <div class="row"><input type="text" id="nameIn" placeholder="Escribe tu nombre completo" value="${esc(S.name||'')}"><button class="btn" data-savename="1">Poner mi nombre</button></div>
  <div class="cert"><p class="eyebrow">Ecosistema Microsoft 365</p><h2>Certificado de competencia</h2>
  <p>Se certifica que</p><div class="who">${esc(S.name||'[Tu nombre]')}</div>
  <p>completó el entrenamiento paso a paso <b>Microsoft 365 corporativo con Copilot</b> por la ruta <b>${esc(nivelTxt().replace(' (sin confirmar)',''))}</b><br>y aprobó el examen final con <b>${sc}/30</b> respuestas correctas.</p>
  <p style="color:var(--soft);font-size:14px;margin-top:18px">${esc(date)}</p></div>
  <div class="row" style="margin-top:16px"><button class="btn ghost" data-copycert="1">Copiar texto del certificado</button><button class="btn ghost" data-newexam="1">Presentar el examen otra vez</button></div>
  <p style="font-size:13.5px;color:var(--soft)">Para guardarlo, toma una captura de pantalla o copia el texto y pégalo en un documento de Word.</p>`;
}

// ---------- router ----------
function route(){
  const h = (location.hash||"").replace("#","") || "inicio";
  let html;
  if(h==="examen") html = examView();
  else if(/^modulo-(\d+)$/.test(h)){ const m = MODS[parseInt(h.split("-")[1],10)-1]; html = m ? moduleView(m) : home(); }
  else html = home();
  $("#main").innerHTML = html;
  renderNav(h);
}
function go(r, keepScroll){ if(location.hash!=="#"+r) location.hash = r; else route(); if(!keepScroll) window.scrollTo(0,0); $("#nav").classList.remove("open"); }
window.addEventListener("hashchange", ()=>{ route(); window.scrollTo(0,0); });

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.go){ if(d.go==="examen" && S.exam && S.exam.pass) EX = null; go(d.go); return; }
  if(d.nivel){ S.nivel = d.nivel; save(); const y=window.scrollY; route(); window.scrollTo(0,y); return; }
  if(d.step){ S.steps[d.step] = !S.steps[d.step]; save(); const y=window.scrollY; route(); window.scrollTo(0,y); return; }
  if(d.mq){ const [mid,qi,oi] = d.mq.split("|").map(Number); const r = S.quiz[mid] || {answers:{}, correct:0}; if(r.answers[qi]!==undefined) return; r.answers[qi]=oi; r.correct = MODS[mid-1].quiz.filter((q,i)=>r.answers[i]===q.a).length; S.quiz[mid]=r; save(); const y=window.scrollY; route(); window.scrollTo(0,y); return; }
  if(d.retry){ delete S.quiz[d.retry]; save(); const y=window.scrollY; route(); window.scrollTo(0,y); return; }
  if(d.eq){ const [qi,oi] = d.eq.split("|").map(Number); if(EX.answers[qi]!==undefined) return; EX.answers[qi]=oi; const y=window.scrollY; route(); window.scrollTo(0,y); return; }
  if(d.finish){ if(Object.keys(EX.answers).length<30) return; EX.finished=true; const c = EX.qs.filter((q,i)=>EX.answers[i]===q.a).length; if(c>=24 && (!S.exam || !S.exam.pass || c>S.exam.score)){ S.exam={pass:true,score:c,date:new Date().toLocaleDateString('es-CO',{year:'numeric',month:'long',day:'numeric'})}; save(); } route(); window.scrollTo(0,0); return; }
  if(d.newexam){ EX=null; newExam(); route(); window.scrollTo(0,0); return; }
  if(d.cert){ EX=null; route(); window.scrollTo(0,0); return; }
  if(d.savename){ S.name = ($("#nameIn").value||"").trim(); save(); route(); return; }
  if(d.copy || d.copycert){
    const txt = d.copy ? d.copy : `Certificado de competencia · Microsoft 365 corporativo. Se certifica que ${S.name||'[Tu nombre]'} completó el entrenamiento paso a paso Microsoft 365 corporativo con Copilot por la ruta ${nivelTxt().replace(' (sin confirmar)','')} y aprobó el examen final con ${S.exam?S.exam.score:0}/30 respuestas correctas. ${S.exam?S.exam.date:''}`;
    const old = t.textContent;
    try{ navigator.clipboard.writeText(txt).then(()=>{ t.textContent="Copiado ✓"; setTimeout(()=>t.textContent=old,1500); }).catch(()=>{ t.textContent="Selecciona y copia a mano"; setTimeout(()=>t.textContent=old,2000); }); }catch(err){ t.textContent="Selecciona y copia a mano"; setTimeout(()=>t.textContent=old,2000); }
    return;
  }
});
$("#menuBtn").addEventListener("click", ()=>$("#nav").classList.toggle("open"));
route();
</script>
