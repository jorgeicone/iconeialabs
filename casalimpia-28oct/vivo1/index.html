<style>
:root{
  --navy:#050d1f; --navy2:#0a1730; --card:#0d1b38; --card2:#12244a;
  --cyan:#00d4ff; --purple:#7b2fff; --orange:#ff8c00;
  --white:#fff; --muted:#8fa3c4; --dim:#5c7099; --red:#ff4d5e; --green:#2ee6a8;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);color:var(--white);font-family:var(--sans);
  min-height:100%;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:16px}
a{color:var(--cyan)}
/* ---------- barra ---------- */
#bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:rgba(5,13,31,.93);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,212,255,.16)}
#logo{width:26px;height:26px;border-radius:6px;background-image:url("");background-size:contain;
  background-repeat:no-repeat;flex:0 0 auto}
.wordmark{font-size:13px;font-weight:900;line-height:1;white-space:nowrap}
.wordmark span{color:var(--cyan);font-weight:500;letter-spacing:.6px}
#spacer{flex:1}
#live{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
#dot.ok{background:var(--green);box-shadow:0 0 0 0 rgba(46,230,168,.6);animation:pl 2s infinite}
#dot.bad{background:var(--red)}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(46,230,168,0)}100%{box-shadow:0 0 0 0 rgba(46,230,168,0)}}
.gnums{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:26px}
.gn{background:var(--card);border:1px solid rgba(0,212,255,.2);border-radius:14px;padding:16px 18px}
.gn b{display:block;font-family:var(--mono);font-size:2.1rem;line-height:1;font-weight:600;color:var(--cyan)}
.gn span{display:block;margin-top:6px;font-size:.82rem;color:var(--muted)}
.gbar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.gbar span{display:block;height:100%;background:var(--green)}
.card.gcita{border-left:3px solid var(--green)}
/* ---------- layout ---------- */
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
h1{font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.12;font-weight:800;letter-spacing:-.015em;margin:0 0 12px}
.intro{color:var(--muted);font-size:1rem;line-height:1.55;margin:0 0 24px}
.f{margin-bottom:18px}
.f label{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:.95rem;font-weight:600;margin-bottom:8px;line-height:1.35}
.lv{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap}
.lv.Funcional{border:1px solid rgba(46,230,168,.45);color:var(--green)}
.lv.Emocional{border:1px solid rgba(0,212,255,.45);color:var(--cyan)}
.lv[class*="Cambio"]{border:1px solid rgba(123,47,255,.5);color:#b48cff}
textarea,input.txt{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(0,212,255,.22);
  border-radius:11px;padding:12px 13px;line-height:1.45;resize:vertical;outline:none;
  transition:border-color .18s,background .18s}
textarea:focus,input.txt:focus{border-color:var(--cyan);background:rgba(0,212,255,.07)}
textarea::placeholder,input.txt::placeholder{color:#43567a}
.saved{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);
  opacity:0;transition:opacity .3s;margin-left:auto}
.saved.on{opacity:1}
/* semáforo */
.sem{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
.sem button{flex:1;min-width:58px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;padding:14px 0;font-family:var(--mono);font-weight:600;font-size:1.05rem;color:var(--muted);cursor:pointer;transition:.16s}
.sem button[data-s="1"]{background:rgba(255,77,94,.16);border-color:var(--red);color:var(--red)}
.sem button[data-s="2"]{background:rgba(46,230,168,.15);border-color:var(--green);color:var(--green)}
.sem button i{display:block;font-style:normal;font-size:8.5px;font-weight:500;letter-spacing:.05em;
  text-transform:uppercase;opacity:.6;margin-top:4px;line-height:1.25;white-space:normal}
.semhint{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
/* estados */
.wait{text-align:center;padding:56px 10px}
.wait .ring{width:56px;height:56px;margin:0 auto 26px;border-radius:50%;border:2px solid rgba(0,212,255,.2);
  border-top-color:var(--cyan);animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:17px 18px;margin-bottom:12px}
.card .who{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);margin-bottom:7px}
.card p{margin:0;font-size:1rem;line-height:1.5}
.card .qq{font-size:.82rem;color:var(--dim);margin:12px 0 3px;font-weight:600}
/* entrada */
.gate{max-width:400px;margin:0 auto;padding:44px 16px}
.gate h1{font-size:1.6rem}
.gate .f{margin-bottom:16px}
.btn{width:100%;background:var(--cyan);border:0;color:var(--navy);border-radius:11px;padding:15px;
  font-size:1rem;font-weight:800;cursor:pointer;letter-spacing:.01em;transition:.16s}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid rgba(0,212,255,.35);color:var(--cyan);font-weight:600;padding:12px}
.err{color:var(--red);font-size:.9rem;margin-top:12px;min-height:20px;line-height:1.4}
/* pie */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,13,31,.95);backdrop-filter:blur(10px);
  border-top:1px solid rgba(0,212,255,.14);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
#foot b{color:var(--muted);font-weight:600}
#fcopy{color:var(--dim);opacity:.75}
@media(max-width:520px){#fcopy{display:none}#fses{display:none}#foot{gap:8px;padding-left:12px;padding-right:12px}#mine,#grupo,#pdf{padding:6px 10px;letter-spacing:.06em}}
@media print{#fcopy{display:inline!important;color:#555}}
#mine,#grupo{margin-left:auto;background:transparent;border:1px solid rgba(0,212,255,.3);color:var(--cyan);
  border-radius:20px;padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer}
.hide{display:none!important}
#pdf{background:transparent;border:1px solid rgba(255,140,0,.45);color:var(--orange);
  border-radius:20px;padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer}
.solo-print{display:none}
.pie-copia{margin-top:34px;padding-top:16px;border-top:1px solid rgba(0,212,255,.15);
  font-family:var(--mono);font-size:9.5px;line-height:1.8;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
@media print{.pie-copia{color:#666;border-top:1px solid #ccc}}
@media print{
  #bar,#foot,#gate,.enviar,.wait{display:none!important}
  html,body{background:#fff!important;color:#111!important}
  main{max-width:none;padding:0}
  h1{color:#000}
  .kick,.intro{color:#555}
  .sec{color:#000;border-color:#bbb}
  .card{background:#fff;border:1px solid #bbb;color:#111;break-inside:avoid;page-break-inside:avoid}
  .card p{color:#111}
  .card .qq{color:#444}
  .solo-print{display:block!important;margin-bottom:18px;border-bottom:2px solid #111;padding-bottom:10px}
  .solo-print .n{font-size:1.5rem;font-weight:800;color:#000}
  .solo-print .m{font-size:.85rem;color:#555;margin-top:4px}
}
/* escala de 1 a 10 (tipo:'diez') */
.diez{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:4px 0 4px}
.diez button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:11px 0;font-family:var(--mono);font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer}
.diez button.sel{background:var(--cyan);border-color:var(--cyan);color:var(--navy)}
.pistas{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-bottom:4px}
/* opción única con puntaje (op) */
.ops{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.ops button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(0,212,255,.22);border-radius:12px;padding:14px 14px;font-size:1rem;line-height:1.35;cursor:pointer;transition:.16s}
.ops button b{font-family:var(--mono);font-weight:600;color:var(--cyan);flex:0 0 auto;min-width:1.2em}
.ops button:active{transform:scale(.99)}
.ops button.sel{background:rgba(0,212,255,.16);border-color:var(--cyan)}
.ops button:disabled{cursor:default}
.ops button:disabled:not(.sel){opacity:.38}
.opest{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.opest.ok{color:var(--green)}
.anon{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:.92rem;color:var(--dim);cursor:pointer}
.anon input{width:19px;height:19px;accent-color:var(--cyan);flex:none}
.enviar{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.enviar .btn{width:auto;flex:1;min-width:190px}
.enviar .est{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);line-height:1.5}
.enviar .est.ok{color:var(--green)}
.enviar .est.bad{color:var(--red)}
.comun{margin-top:34px;padding-top:22px;border-top:1px solid rgba(0,212,255,.2)}
.comun .ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--orange);margin-bottom:6px}
.comun h2{font-size:1.25rem;font-weight:800;margin:0 0 16px;letter-spacing:-.01em}
.pers{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 16px;margin-bottom:11px}
.pers .who{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
.pers .q{font-size:.76rem;color:var(--dim);font-weight:600;margin:9px 0 2px;line-height:1.3}
.pers .a{font-size:.95rem;line-height:1.45}
.pers .a.vac{color:var(--red);font-style:italic;font-size:.85rem}
.pers.yo{border-color:rgba(0,212,255,.3)}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin:30px 0 12px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>

<div id="bar">
  <div id="logo"></div>
  <div class="wordmark">Universidad <span>EAN</span></div>
  <div id="spacer"></div>
  <div id="live"><span id="dot"></span><span id="livetxt">conectando</span></div>
</div>

<!-- ENTRADA -->
<div class="gate" id="gate">
  <div class="kick">Módulo 4 · Revenue Intelligence</div>
  <h1>Kit en vivo de la sesión</h1>
  <p class="intro">Escribe el código que está en la pantalla y tu nombre. Lo que llenes aquí se guarda solo y lo ve tu facilitador al mismo tiempo.</p>
  <div class="f"><label>Código de la sesión</label>
    <input class="txt" id="gcod" placeholder="CLRI1" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
  <div class="f"><label>Tu nombre</label>
    <input class="txt" id="gnom" placeholder="Nombre y apellido" autocomplete="name"></div>
  <button class="btn" id="gbtn">Entrar</button>
  <div class="err" id="gerr"></div>
</div>

<!-- APP -->
<main id="app" class="hide"></main>

<div id="foot" class="hide">
  <span><b id="fnom">—</b></span>
  <span id="fses"></span>
  <span id="fcopy" style="text-transform:none">© 2026 Ing. Jorge Hugo Pérez Gaona · ICONEialabs</span>
  <button id="grupo">El grupo</button>
  <button id="mine">Mis respuestas</button>
  <button id="pdf">Guardar PDF</button>
</div>

<script>
/* ================= CONFIG ================= */
const SB_URL='https://nvgkhdrrxqdgxktfkioa.supabase.co', SB_KEY='sb_publishable_d1RrtE7S-9a8e8mGKRRjxQ_4HU_nkDl';

/* identidad de dispositivo — la RLS exige que coincida con la cabecera */
let DISP = localStorage.getItem('aula_disp');
if(!DISP){ DISP = (crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());
           localStorage.setItem('aula_disp', DISP); }

const sb = supabase.createClient(SB_URL, SB_KEY, {
  global:{ headers:{ 'x-dispositivo': DISP } },
  realtime:{ params:{ eventsPerSecond:5 } }
});

const COLS='id,codigo,titulo,bloque_activo,mostrar_respuestas,comun,estado';
const $=s=>document.querySelector(s);
let SES=null, PAR=null, BLOQUE=null, VALS={}, canal=null, viendoMias=false;
let viendoGrupo=false, GRUPO=null;

/* ================= ENTRADA ================= */
const qs=new URLSearchParams(location.search);
$('#gcod').value=(qs.get('s')||localStorage.getItem('aula_cod')||'CLRI1').toUpperCase();
$('#gnom').value=localStorage.getItem('aula_nom')||'';
$('#gcod').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
[$('#gcod'),$('#gnom')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')entrar()}));
$('#gbtn').onclick=entrar;

async function entrar(){
  const cod=$('#gcod').value.trim().toUpperCase(), nom=$('#gnom').value.trim().replace(/\s+/g,' ');
  const err=$('#gerr'); err.textContent='';
  if(!cod||!nom){ err.textContent='Falta el código o tu nombre.'; return; }
  /* El nombre es lo que va a salir en tu PDF y en el informe del cliente.
     Sin esto la gente escribe el número de la sesión en la casilla del nombre. */
  const soloNum = /^[\d\W_]+$/.test(nom);
  if(soloNum || nom.length<3){
    err.textContent = soloNum
      ? 'Ese es el código, no tu nombre. Escribe tu nombre y tu apellido.'
      : 'Escribe tu nombre completo: así lo vas a ver en tu PDF al final.';
    $('#gnom').focus(); return;
  }
  if(nom.split(' ').length<2 && !$('#gnom').dataset.insistio){
    $('#gnom').dataset.insistio='1';
    err.textContent='¿Solo «'+nom+'»? Mejor con apellido. Si así está bien, vuelve a tocar Entrar.';
    return;
  }
  $('#gbtn').disabled=true; $('#gbtn').textContent='Entrando…';
  try{
    const {data:ses,error:e1}=await sb.from('aula_sesiones').select(COLS).eq('codigo',cod).maybeSingle();
    if(e1) throw e1;
    if(!ses) throw new Error('No encontramos ese código. Revísalo en la pantalla.');
    if(ses.estado!=='abierta') throw new Error('Esa sesión ya está cerrada.');
    SES=ses;
    let {data:par}=await sb.from('aula_participantes').select('*')
        .eq('sesion_id',ses.id).eq('dispositivo',DISP).maybeSingle();
    if(par){ if(par.nombre!==nom){ await sb.from('aula_participantes').update({nombre:nom}).eq('id',par.id); par.nombre=nom; } }
    else{
      const {data:np,error:e2}=await sb.from('aula_participantes')
        .insert({sesion_id:ses.id,nombre:nom,dispositivo:DISP}).select().single();
      if(e2) throw e2; par=np;
    }
    PAR=par;
    localStorage.setItem('aula_cod',cod); localStorage.setItem('aula_nom',nom);
    await cargarRespuestas();
    arrancar();
  }catch(ex){
    err.textContent = ex.message||'No pudimos conectarte. Revisa tu conexión e inténtalo otra vez.';
    $('#gbtn').disabled=false; $('#gbtn').textContent='Entrar';
  }
}

async function cargarRespuestas(){
  const {data}=await sb.from('aula_respuestas').select('bloque,campo,valor').eq('participante_id',PAR.id);
  VALS={}; (data||[]).forEach(r=>{ VALS[r.bloque+'|'+r.campo]=r.valor; });
}

function arrancar(){
  $('#gate').classList.add('hide'); $('#app').classList.remove('hide'); $('#foot').classList.remove('hide');
  $('#fnom').textContent=PAR.nombre;
  $('#fses').textContent=SES.codigo;
  $('#mine').onclick=()=>{ viendoMias=!viendoMias; viendoGrupo=false;
    $('#grupo').textContent='El grupo';
    $('#mine').textContent=viendoMias?'Volver':'Mis respuestas'; pintar(); };
  $('#grupo').onclick=async()=>{
    viendoGrupo=!viendoGrupo; viendoMias=false; $('#mine').textContent='Mis respuestas';
    $('#grupo').textContent=viendoGrupo?'Volver':'El grupo';
    if(viendoGrupo) await cargarGrupo();
    pintar(); };
  $('#pdf').onclick=descargarPDF;
  suscribir();
  pintar();
}

/* ================= TIEMPO REAL ================= */
function estado(k,txt){ const d=$('#dot'); d.className=k; $('#livetxt').textContent=txt; }
function suscribir(){
  if(canal) sb.removeChannel(canal);
  canal = sb.channel('aula-'+SES.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'aula_sesiones',filter:'id=eq.'+SES.id},
      ()=>refrescarSesion())
    .subscribe(st=>{
      if(st==='SUBSCRIBED') estado('ok','en vivo');
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){ estado('bad','reconectando'); setTimeout(suscribir,3000); }
      else estado('','conectando');
    });
  /* Red de seguridad: si el websocket se cae, seguimos leyendo el bloque.
     Con la pantalla apagada o la pestaña oculta no se lee nada — en una sala de
     treinta celulares eso es la mayor parte del tráfico, y no sirve para nada. */
  if(!window._poll) window._poll=setInterval(()=>{ if(!document.hidden) refrescarSesion(); },6000);
  if(!window._vis){ window._vis=1;
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refrescarSesion(); }); }
}
async function refrescarSesion(){
  const {data}=await sb.from('aula_sesiones').select(COLS).eq('id',SES.id).maybeSingle();
  if(!data) return;
  const cambio = data.bloque_activo!==SES.bloque_activo || data.comun!==SES.comun || data.estado!==SES.estado;
  SES=data;
  if(cambio && !viendoMias) pintar();
}

/* ================= GUARDADO ================= */
const timers={};
function guardar(bloque,campo,valor,badge){
  const k=bloque+'|'+campo; VALS[k]=valor;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{
    const {error}=await sb.from('aula_respuestas')
      .upsert({sesion_id:SES.id,participante_id:PAR.id,bloque,campo,valor,actualizado:new Date().toISOString()},
              {onConflict:'participante_id,bloque,campo'});
    if(badge){ badge.textContent=error?'no se guardó':'guardado';
      badge.style.color=error?'var(--red)':'var(--green)';
      badge.classList.add('on'); setTimeout(()=>badge.classList.remove('on'),1600); }
  },700);
}

/* ================= EL GRUPO =================
   Solo agregados: cuántos escribieron y, si el facilitador lo habilitó, los
   compromisos SIN AUTOR. Nunca filas de otras personas: eso lo garantiza la
   función aula_resumen_publico en la base, no este archivo. */
async function cargarGrupo(){
  GRUPO={cargando:true};
  try{
    const {data,error}=await sb.rpc('aula_resumen_publico',{p_codigo:SES.codigo});
    if(error) throw error;
    GRUPO=data||{};
  }catch(e){
    GRUPO={error:/no_habilitado/.test(String(e&&e.message))?'apagado':'falla'};
  }
}
function pintarGrupo(app){
  if(GRUPO&&GRUPO.cargando){ app.innerHTML='<div class="card"><p class="intro" style="margin:0">Un momento…</p></div>'; return; }
  if(!GRUPO||GRUPO.error){
    app.innerHTML='<div class="kick">El grupo</div><h1>Todavía no</h1>'+
      '<div class="card"><p class="intro" style="margin:0">'+
      (GRUPO&&GRUPO.error==='apagado'
        ? 'Tu facilitador todavía no ha abierto el resumen del grupo para esta sesión.'
        : 'No pude traer el resumen del grupo en este momento. Intenta de nuevo en un minuto.')+
      '</p></div>'; return;
  }
  const g=GRUPO, mios=(BLOQUES&&Object.keys(BLOQUES))||[];
  const pct=g.participantes? Math.round(g.escribieron/g.participantes*100):0;
  let h='<div class="kick">El grupo</div><h1>No eras el único</h1>'+
    '<p class="intro">Esto es lo que hizo la sala completa hoy. Sin nombres: solo lo que se escribió.</p>'+
    '<div class="gnums">'+
      '<div class="gn"><b>'+g.participantes+'</b><span>en la sala</span></div>'+
      '<div class="gn"><b>'+g.escribieron+'</b><span>escribieron</span></div>'+
      '<div class="gn"><b>'+pct+'%</b><span>participó</span></div>'+
      '<div class="gn"><b>'+g.respuestas+'</b><span>respuestas</span></div></div>';
  const bl=(g.bloques||[]).filter(b=>b.personas>0);
  if(bl.length){
    h+='<div class="sec">Ejercicio por ejercicio</div>';
    bl.forEach(b=>{ const t=BLOQUES[b.bloque]; const w=g.participantes?Math.round(b.personas/g.participantes*100):0;
      h+='<div class="card"><div class="qq">'+esc((t&&t.t)||b.bloque)+'</div>'+
         '<div class="gbar"><span style="width:'+w+'%"></span></div>'+
         '<p style="margin:8px 0 0;font-size:.92rem;color:var(--muted)">'+b.personas+' de '+g.participantes+' personas ('+w+'%)</p></div>'; });
  }
  const tx=(g.textos||[]);
  if(tx.length){
    h+='<div class="sec">Lo que la sala se comprometió a hacer</div>'+
       '<p class="intro">Escrito por tus compañeros, sin nombres.</p>';
    tx.forEach(t=>{ h+='<div class="card gcita"><p style="margin:0">'+esc(t)+'</p></div>'; });
  }
  h+='<div class="pie-copia">ICONEialabs · Método ICONE — Estrategia · Sistemas · Resultados<br>'+
     '© 2026 Ing. Jorge Hugo Pérez Gaona · ICONEialabs. Todos los derechos reservados.<br>Ing. Jorge Hugo Pérez Gaona · www.iconeialabs.com</div>';
  app.innerHTML=h;
}

/* ================= PINTAR ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pintar(){
  const app=$('#app');
  if(viendoGrupo) return pintarGrupo(app);
  if(viendoMias) return pintarMias(app);
  const id=SES.bloque_activo||'espera';
  const b=BLOQUES[id]||BLOQUES.espera;
  BLOQUE=id;
  if(!b.campos.length && !b.semaforo){
    app.innerHTML='<div class="wait"><div class="ring"></div><div class="kick">'+esc(b.kick)+'</div>'+
      '<h1>'+esc(b.t)+'</h1><p class="intro" style="max-width:34ch;margin:0 auto">'+esc(b.intro)+'</p></div>';
    return;
  }
  let h='<div class="kick">'+esc(b.kick)+'</div><h1>'+esc(b.t)+'</h1><p class="intro">'+esc(b.intro)+'</p>';
  b.campos.forEach(c=>{
    if(c.op){ h+=opHTML(id,c); return; }
    if(c.tipo==='diez'){ h+=diezHTML(id,c); return; }
    const v=esc(VALS[id+'|'+c.k]||'');
    h+='<div class="f"><label>'+esc(c.l)+
       (c.lv?'<span class="lv '+esc(c.lv.split(' ')[0])+'">'+esc(c.lv)+'</span>':'')+
       '<span class="saved" data-badge="'+esc(c.k)+'"></span></label>'+
       '<textarea rows="'+(c.rows||2)+'" data-k="'+esc(c.k)+'" placeholder="'+esc(c.ph||'')+'">'+v+'</textarea></div>';
  });
  if(b.semaforo){
    h+='<div class="semhint">Toca cada anclaje · gris sin dato · rojo falta · verde resuelto</div><div class="sem">';
    semPares(b).forEach(([L,sig])=>{ const s=VALS[id+'|sem_'+L]||'0';
      h+='<button data-sem="'+L+'" data-s="'+esc(s)+'">'+L+
         (sig?'<i>'+esc(sig)+'</i>':'')+'</button>'; });
    h+='</div>';
  }
  if(b.modo==='vitrina'){
    h+='<label class="anon"><input type="checkbox" id="anon"'+
       ((VALS[id+'|_anon']||'')==='1'?' checked':'')+
       '> Si esta respuesta sale en pantalla, que salga sin mi nombre</label>';
  }
  if(b.campos.some(c=>!c.op)||b.semaforo)
  h+='<div class="enviar"><button class="btn" id="btnenv">Enviar respuestas</button>'+
     '<span class="est" id="estenv">Se guarda solo mientras escribes</span></div>';
  app.innerHTML=h;
  const be=document.getElementById('btnenv');
  if(be) be.onclick=()=>enviarBloque(id);
  const an=document.getElementById('anon');
  if(an) an.onchange=()=>guardar(id,'_anon',an.checked?'1':'0',null);
  app.querySelectorAll('textarea[data-k]').forEach(t=>{
    const badge=app.querySelector('[data-badge="'+t.dataset.k+'"]');
    t.addEventListener('input',()=>guardar(id,t.dataset.k,t.value,badge));
  });
  app.querySelectorAll('[data-diez]').forEach(btn=>{
    btn.onclick=()=>{ const k=btn.dataset.diez; btn.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===btn));
      guardar(id,k,btn.dataset.v,app.querySelector('[data-badge="'+k+'"]')); }; });
  app.querySelectorAll('[data-op]').forEach(btn=>{
    btn.onclick=()=>elegirOp(id,btn.dataset.op,+btn.dataset.i,btn); });
  app.querySelectorAll('[data-sem]').forEach(btn=>{
    btn.onclick=()=>{ const n=String((+btn.dataset.s+1)%3); btn.dataset.s=n;
      guardar(id,'sem_'+btn.dataset.sem,n,null); };
  });
}

async function enviarBloque(id){
  const btn=document.getElementById('btnenv'), est=document.getElementById('estenv');
  if(!btn) return;
  btn.disabled=true; const prev=btn.textContent; btn.textContent='Enviando…';
  est.className='est'; est.textContent='—';
  /* cancela los guardados pendientes y manda todo de una */
  Object.keys(timers).forEach(k=>{ if(k.indexOf(id+'|')===0) clearTimeout(timers[k]); });
  const b=BLOQUES[id]||{campos:[]};
  const filas=[];
  (b.campos||[]).forEach(c=>filas.push({campo:c.k, valor:VALS[id+'|'+c.k]||''}));
  semPares(b).forEach(([L])=>filas.push({campo:'sem_'+L, valor:VALS[id+'|sem_'+L]||'0'}));
  const ahora=new Date().toISOString();
  const {error}=await sb.from('aula_respuestas').upsert(
    filas.map(f=>({sesion_id:SES.id,participante_id:PAR.id,bloque:id,campo:f.campo,valor:f.valor,actualizado:ahora})),
    {onConflict:'participante_id,bloque,campo'});
  btn.disabled=false; btn.textContent=prev;
  if(error){ est.className='est bad'; est.textContent='No se pudo enviar · revisa tu conexión e inténtalo otra vez'; return; }
  const hh=new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  est.className='est ok'; est.textContent='✓ Enviado a las '+hh+' · puedes seguir editando';
  btn.textContent='Enviar de nuevo';
}


/* ===== opción única (op) =====
   {k:'p1', l:'¿Pregunta?', op:['Opción A','Opción B',…]}  → botones.
   El valor guardado es «B · texto de la opción» (legible en consola, informe y PDF)
   y aparte, en _t_<k>, la hora en que se tocó: de ahí sale el bono por rapidez.
   La respuesta queda fija al primer toque, salvo libre:true. La clave de respuestas
   NUNCA viaja en el kit: vive solo en el deck (puntaje.js). */
const LETRAS='ABCDEFGH';
function diezHTML(id,c){
  const v=VALS[id+'|'+c.k]||'', p=c.pistas||['',''];
  let h='<div class="f"><label>'+esc(c.l)+'<span class="saved" data-badge="'+esc(c.k)+'"></span></label><div class="diez">';
  for(let n=1;n<=10;n++) h+='<button data-diez="'+esc(c.k)+'" data-v="'+n+'"'+(v===String(n)?' class="sel"':'')+'>'+n+'</button>';
  return h+'</div><div class="pistas"><span>'+esc(p[0])+'</span><span>'+esc(p[1])+'</span></div></div>';
}
function opHTML(id,c){
  const v=VALS[id+'|'+c.k]||'', fija=!c.libre && !!v;
  let h='<div class="f"><label>'+esc(c.l)+'</label><div class="ops">';
  c.op.forEach((t,i)=>{ const val=LETRAS[i]+' · '+t, sel=v===val;
    h+='<button data-op="'+esc(c.k)+'" data-i="'+i+'"'+(sel?' class="sel"':'')+(fija?' disabled':'')+
       '><b>'+LETRAS[i]+'</b><span>'+esc(t)+'</span></button>'; });
  h+='</div><div class="opest'+(v?' ok':'')+'" data-opest="'+esc(c.k)+'">'+
     (v?(c.libre?'✓ Guardada · puedes cambiarla':'✓ Respuesta registrada'):(c.libre?'Toca una opción':'Toca una opción · solo vale el primer toque'))+'</div></div>';
  return h;
}
async function elegirOp(id,k,i,btn){
  const b=BLOQUES[id]||{campos:[]}, c=(b.campos||[]).find(x=>x.k===k); if(!c) return;
  const prev=VALS[id+'|'+k]||''; if(prev && !c.libre) return;
  const val=LETRAS[i]+' · '+c.op[i], t=String(Date.now());
  VALS[id+'|'+k]=val; VALS[id+'|_t_'+k]=t;
  const grupo=btn.parentNode, est=document.querySelector('[data-opest="'+k+'"]');
  grupo.querySelectorAll('button').forEach(x=>{ x.classList.toggle('sel',x===btn); if(!c.libre) x.disabled=true; });
  if(est){ est.className='opest'; est.textContent='Guardando…'; }
  const ahora=new Date().toISOString();
  const {error}=await sb.from('aula_respuestas').upsert([
      {sesion_id:SES.id,participante_id:PAR.id,bloque:id,campo:k,valor:val,actualizado:ahora},
      {sesion_id:SES.id,participante_id:PAR.id,bloque:id,campo:'_t_'+k,valor:t,actualizado:ahora}],
    {onConflict:'participante_id,bloque,campo'});
  if(error){ VALS[id+'|'+k]=prev; grupo.querySelectorAll('button').forEach(x=>{x.disabled=false;x.classList.remove('sel');});
    if(est){ est.className='opest'; est.style.color='var(--red)'; est.textContent='No se guardó · revisa tu conexión y toca otra vez'; } return; }
  if(est){ est.className='opest ok'; est.style.color=''; est.textContent=c.libre?'✓ Guardada · puedes cambiarla':'✓ Respuesta registrada'; }
}

/* semaforo acepta ['A', ...] o [['A','Decisor real'], ...] */
function semPares(b){ return (b.semaforo||[]).map(x=>Array.isArray(x)?x:[x,'']); }

function pintarMias(app){
  const hoy=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
  let h='<div class="solo-print"><div class="n">'+esc((PAR&&PAR.nombre)||'')+'</div>'+
        '<div class="m">'+esc((SES&&SES.titulo)||'')+' · '+hoy+'</div></div>'+
        '<div class="kick">Tu cuaderno</div><h1>Lo que has escrito hoy</h1>'+
        '<p class="intro">Todo queda guardado con tu nombre. Vuelve a esta dirección cuando quieras y lo encuentras. Con <b>Guardar PDF</b> te lo llevas al celular.</p>';
  let algo=false;
  Object.keys(BLOQUES).forEach(id=>{
    const b=BLOQUES[id]; const campos=(b.campos||[]);
    const hay=campos.some(c=>(VALS[id+'|'+c.k]||'').trim()) ||
              semPares(b).some(([L])=>VALS[id+'|sem_'+L]&&VALS[id+'|sem_'+L]!=='0');
    if(!hay) return; algo=true;
    h+='<div class="sec">'+esc(b.t)+'</div>';
    campos.forEach(c=>{ const v=(VALS[id+'|'+c.k]||'').trim(); if(!v) return;
      h+='<div class="card"><div class="qq">'+esc(c.l)+'</div><p>'+esc(v)+'</p></div>'; });
    if(b.semaforo){
      const t=semPares(b).map(([L,sig])=>L+(sig?' ('+sig+')':'')+': '+
        ({'0':'sin dato','1':'falta','2':'resuelto'}[VALS[id+'|sem_'+L]||'0'])).join(' · ');
      h+='<div class="card"><p style="font-family:var(--mono);font-size:.85rem">'+esc(t)+'</p></div>';
    }
  });
  if(!algo) h+='<div class="card"><p class="intro" style="margin:0">Todavía no has escrito nada. Vuelve cuando llenes el primer bloque.</p></div>';
  h+='<div class="pie-copia">ICONEialabs · Método ICONE — Estrategia · Sistemas · Resultados<br>'+
     '© 2026 Ing. Jorge Hugo Pérez Gaona · ICONEialabs. Todos los derechos reservados.<br>Ing. Jorge Hugo Pérez Gaona · www.iconeialabs.com</div>';
  app.innerHTML=h;
}

function descargarPDF(){
  if(!viendoMias){ viendoMias=true; $('#mine').textContent='Volver'; pintar(); }
  setTimeout(()=>window.print(),350);
}

/* auto-entrada si ya estuvo aquí */
(async()=>{
  const cod=localStorage.getItem('aula_cod'), nom=localStorage.getItem('aula_nom');
  if(cod&&nom){ $('#gcod').value=qs.get('s')?qs.get('s').toUpperCase():cod; $('#gnom').value=nom; entrar(); }
})();
</script>
