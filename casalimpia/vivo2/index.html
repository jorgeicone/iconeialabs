<style>
:root{
  --navy:#050d1f; --navy2:#0a1730; --card:#0d1b38; --card2:#12244a;
  --cyan:#00d4ff; --purple:#7b2fff; --orange:#ff8c00;
  --white:#fff; --muted:#8fa3c4; --dim:#5c7099; --red:#ff4d5e; --green:#2ee6a8;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--navy);color:var(--white);font-family:var(--sans);
  min-height:100%;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:16px}
a{color:var(--cyan)}
/* ---------- barra ---------- */
#bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:rgba(5,13,31,.93);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,212,255,.16)}
#logo{width:26px;height:26px;border-radius:6px;background-image:url("");background-size:contain;
  background-repeat:no-repeat;flex:0 0 auto}
.wordmark{font-size:13px;font-weight:900;line-height:1;white-space:nowrap}
.wordmark span{color:var(--cyan);font-weight:500;letter-spacing:.6px}
#spacer{flex:1}
#live{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
#dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:0 0 auto}
#dot.ok{background:var(--green);box-shadow:0 0 0 0 rgba(46,230,168,.6);animation:pl 2s infinite}
#dot.bad{background:var(--red)}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(46,230,168,0)}100%{box-shadow:0 0 0 0 rgba(46,230,168,0)}}
.gnums{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:26px}
.gn{background:var(--card);border:1px solid rgba(0,212,255,.2);border-radius:14px;padding:16px 18px}
.gn b{display:block;font-family:var(--mono);font-size:2.1rem;line-height:1;font-weight:600;color:var(--cyan)}
.gn span{display:block;margin-top:6px;font-size:.82rem;color:var(--muted)}
.gbar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.gbar span{display:block;height:100%;background:var(--green)}
.card.gcita{border-left:3px solid var(--green)}
/* ---------- layout ---------- */
main{max-width:720px;margin:0 auto;padding:22px 16px 90px}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
h1{font-size:clamp(1.5rem,6vw,2.1rem);line-height:1.12;font-weight:800;letter-spacing:-.015em;margin:0 0 12px}
.intro{color:var(--muted);font-size:1rem;line-height:1.55;margin:0 0 24px}
.f{margin-bottom:18px}
.f label{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:.95rem;font-weight:600;margin-bottom:8px;line-height:1.35}
.lv{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:20px;white-space:nowrap}
.lv.Funcional{border:1px solid rgba(46,230,168,.45);color:var(--green)}
.lv.Emocional{border:1px solid rgba(0,212,255,.45);color:var(--cyan)}
.lv[class*="Cambio"]{border:1px solid rgba(123,47,255,.5);color:#b48cff}
textarea,input.txt{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(0,212,255,.22);
  border-radius:11px;padding:12px 13px;line-height:1.45;resize:vertical;outline:none;
  transition:border-color .18s,background .18s}
textarea:focus,input.txt:focus{border-color:var(--cyan);background:rgba(0,212,255,.07)}
textarea::placeholder,input.txt::placeholder{color:#43567a}
.saved{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);
  opacity:0;transition:opacity .3s;margin-left:auto}
.saved.on{opacity:1}
/* semáforo */
.sem{display:flex;gap:9px;flex-wrap:wrap;margin:6px 0 18px}
.sem button{flex:1;min-width:58px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;padding:14px 0;font-family:var(--mono);font-weight:600;font-size:1.05rem;color:var(--muted);cursor:pointer;transition:.16s}
.sem button[data-s="1"]{background:rgba(255,77,94,.16);border-color:var(--red);color:var(--red)}
.sem button[data-s="2"]{background:rgba(46,230,168,.15);border-color:var(--green);color:var(--green)}
.sem button i{display:block;font-style:normal;font-size:8.5px;font-weight:500;letter-spacing:.05em;
  text-transform:uppercase;opacity:.6;margin-top:4px;line-height:1.25;white-space:normal}
.semhint{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
/* estados */
.wait{text-align:center;padding:56px 10px}
.wait .ring{width:56px;height:56px;margin:0 auto 26px;border-radius:50%;border:2px solid rgba(0,212,255,.2);
  border-top-color:var(--cyan);animation:sp 1.1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:17px 18px;margin-bottom:12px}
.card .who{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);margin-bottom:7px}
.card p{margin:0;font-size:1rem;line-height:1.5}
.card .qq{font-size:.82rem;color:var(--dim);margin:12px 0 3px;font-weight:600}
/* entrada */
.gate{max-width:400px;margin:0 auto;padding:44px 16px}
.gate h1{font-size:1.6rem}
.gate .f{margin-bottom:16px}
.btn{width:100%;background:var(--cyan);border:0;color:var(--navy);border-radius:11px;padding:15px;
  font-size:1rem;font-weight:800;cursor:pointer;letter-spacing:.01em;transition:.16s}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid rgba(0,212,255,.35);color:var(--cyan);font-weight:600;padding:12px}
.err{color:var(--red);font-size:.9rem;margin-top:12px;min-height:20px;line-height:1.4}
/* pie */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(5,13,31,.95);backdrop-filter:blur(10px);
  border-top:1px solid rgba(0,212,255,.14);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
#foot b{color:var(--muted);font-weight:600}
#fcopy{color:var(--dim);opacity:.75}
@media(max-width:520px){#fcopy{display:none}#fses{display:none}#foot{gap:8px;padding-left:12px;padding-right:12px}#mine,#grupo,#pdf{padding:6px 10px;letter-spacing:.06em}}
@media print{#fcopy{display:inline!important;color:#555}}
#mine,#grupo{margin-left:auto;background:transparent;border:1px solid rgba(0,212,255,.3);color:var(--cyan);
  border-radius:20px;padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer}
.hide{display:none!important}
#pdf{background:transparent;border:1px solid rgba(255,140,0,.45);color:var(--orange);
  border-radius:20px;padding:7px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer}
.solo-print{display:none}
.pie-copia{margin-top:34px;padding-top:16px;border-top:1px solid rgba(0,212,255,.15);
  font-family:var(--mono);font-size:9.5px;line-height:1.8;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim)}
@media print{.pie-copia{color:#666;border-top:1px solid #ccc}}
@media print{
  #bar,#foot,#gate,.enviar,.wait{display:none!important}
  html,body{background:#fff!important;color:#111!important}
  main{max-width:none;padding:0}
  h1{color:#000}
  .kick,.intro{color:#555}
  .sec{color:#000;border-color:#bbb}
  .card{background:#fff;border:1px solid #bbb;color:#111;break-inside:avoid;page-break-inside:avoid}
  .card p{color:#111}
  .card .qq{color:#444}
  .solo-print{display:block!important;margin-bottom:18px;border-bottom:2px solid #111;padding-bottom:10px}
  .solo-print .n{font-size:1.5rem;font-weight:800;color:#000}
  .solo-print .m{font-size:.85rem;color:#555;margin-top:4px}
}
/* escala de 1 a 10 (tipo:'diez') */
.diez{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:4px 0 4px}
.diez button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:11px 0;font-family:var(--mono);font-weight:600;font-size:.95rem;color:var(--muted);cursor:pointer}
.diez button.sel{background:var(--cyan);border-color:var(--cyan);color:var(--navy)}
.pistas{display:flex;justify-content:space-between;font-size:.72rem;color:var(--dim);margin-bottom:4px}
/* opción única con puntaje (op) */
.ops{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.ops button{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(0,212,255,.22);border-radius:12px;padding:14px 14px;font-size:1rem;line-height:1.35;cursor:pointer;transition:.16s}
.ops button b{font-family:var(--mono);font-weight:600;color:var(--cyan);flex:0 0 auto;min-width:1.2em}
.ops button:active{transform:scale(.99)}
.ops button.sel{background:rgba(0,212,255,.16);border-color:var(--cyan)}
.ops button:disabled{cursor:default}
.ops button:disabled:not(.sel){opacity:.38}
.opest{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.opest.ok{color:var(--green)}
.anon{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:.92rem;color:var(--dim);cursor:pointer}
.anon input{width:19px;height:19px;accent-color:var(--cyan);flex:none}
.enviar{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.enviar .btn{width:auto;flex:1;min-width:190px}
.enviar .est{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);line-height:1.5}
.enviar .est.ok{color:var(--green)}
.enviar .est.bad{color:var(--red)}
.comun{margin-top:34px;padding-top:22px;border-top:1px solid rgba(0,212,255,.2)}
.comun .ct{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--orange);margin-bottom:6px}
.comun h2{font-size:1.25rem;font-weight:800;margin:0 0 16px;letter-spacing:-.01em}
.pers{background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 16px;margin-bottom:11px}
.pers .who{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
.pers .q{font-size:.76rem;color:var(--dim);font-weight:600;margin:9px 0 2px;line-height:1.3}
.pers .a{font-size:.95rem;line-height:1.45}
.pers .a.vac{color:var(--red);font-style:italic;font-size:.85rem}
.pers.yo{border-color:rgba(0,212,255,.3)}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
  margin:30px 0 12px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body>

<div id="bar">
  <div id="logo"></div>
  <div class="wordmark">Universidad <span>EAN</span></div>
  <div id="spacer"></div>
  <div id="live"><span id="dot"></span><span id="livetxt">conectando</span></div>
</div>

<!-- ENTRADA -->
<div class="gate" id="gate">
  <div class="kick">Módulo 4 · Revenue Intelligence · Casalimpia</div>
  <h1>Kit en vivo de la sesión</h1>
  <p class="intro">Escribe el código que está en la pantalla y tu nombre. Lo que llenes aquí se guarda solo y lo ve tu facilitador al mismo tiempo.</p>
  <div class="f"><label>Código de la sesión</label>
    <input class="txt" id="gcod" placeholder="CLM4S2" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
  <div class="f"><label>Tu nombre</label>
    <input class="txt" id="gnom" placeholder="Nombre y apellido" autocomplete="name"></div>
  <button class="btn" id="gbtn">Entrar</button>
  <div class="err" id="gerr"></div>
</div>

<!-- APP -->
<main id="app" class="hide"></main>

<div id="foot" class="hide">
  <span><b id="fnom">—</b></span>
  <span id="fses"></span>
  <span id="fcopy">© 2026 ICONEialabs</span>
  <button id="grupo">El grupo</button>
  <button id="mine">Mis respuestas</button>
  <button id="pdf">Guardar PDF</button>
</div>

  if(!window._poll) window._poll=setInterval(()=>{ if(!document.hidden) refrescarSesion(); },6000);

    {onConflict:'participante_id,bloque,campo'});
  if(error){ VALS[id+'|'+k]=prev; grupo.querySelectorAll('button').forEach(x=>{x.disabled=false;x.classList.remove('sel');});
    if(est){ est.className='opest'; est.style.color='var(--red)'; est.textContent='No se guardó · revisa tu conexión y toca otra vez'; } return; }
  if(est){ est.className='opest ok'; est.style.color=''; est.textContent=c.libre?'✓ Guardada · puedes cambiarla':'✓ Respuesta registrada'; }
}

/* semaforo acepta ['A', ...] o [['A','Decisor real'], ...] */
function semPares(b){ return (b.semaforo||[]).map(x=>Array.isArray(x)?x:[x,'']); }

function pintarMias(app){
  const hoy=new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
  let h='<div class="solo-print"><div class="n">'+esc((PAR&&PAR.nombre)||'')+'</div>'+
        '<div class="m">'+esc((SES&&SES.titulo)||'')+' · '+hoy+'</div></div>'+
        '<div class="kick">Tu cuaderno</div><h1>Lo que has escrito hoy</h1>'+
        '<p class="intro">Todo queda guardado con tu nombre. Vuelve a esta dirección cuando quieras y lo encuentras. Con <b>Guardar PDF</b> te lo llevas al celular.</p>';
  let algo=false;
  Object.keys(BLOQUES).forEach(id=>{
    const b=BLOQUES[id]; const campos=(b.campos||[]);
    const hay=campos.some(c=>(VALS[id+'|'+c.k]||'').trim()) ||
              semPares(b).some(([L])=>VALS[id+'|sem_'+L]&&VALS[id+'|sem_'+L]!=='0');
    if(!hay) return; algo=true;
    h+='<div class="sec">'+esc(b.t)+'</div>';
    campos.forEach(c=>{ const v=(VALS[id+'|'+c.k]||'').trim(); if(!v) return;
      h+='<div class="card"><div class="qq">'+esc(c.l)+'</div><p>'+esc(v)+'</p></div>'; });
    if(b.semaforo){
      const t=semPares(b).map(([L,sig])=>L+(sig?' ('+sig+')':'')+': '+
        ({'0':'sin dato','1':'falta','2':'resuelto'}[VALS[id+'|sem_'+L]||'0'])).join(' · ');
      h+='<div class="card"><p style="font-family:var(--mono);font-size:.85rem">'+esc(t)+'</p></div>';
    }
  });
  if(!algo) h+='<div class="card"><p class="intro" style="margin:0">Todavía no has escrito nada. Vuelve cuando llenes el primer bloque.</p></div>';
  h+='<div class="pie-copia">ICONEialabs · Método ICONE — Estrategia · Sistemas · Resultados<br>'+
     '© '+new Date().getFullYear()+' ICONEialabs. Todos los derechos reservados.</div>';
  app.innerHTML=h;
}

function descargarPDF(){
  if(!viendoMias){ viendoMias=true; $('#mine').textContent='Volver'; pintar(); }
  setTimeout(()=>window.print(),350);
}

/* auto-entrada si ya estuvo aquí */
(async()=>{
  const cod=localStorage.getItem('aula_cod'), nom=localStorage.getItem('aula_nom');
  if(cod&&nom){ $('#gcod').value=qs.get('s')?qs.get('s').toUpperCase():cod; $('#gnom').value=nom; entrar(); }
})();
</script>
