<script>
const PASOS = [{"id": "paso1", "titulo": "Qué cambió", "sub": "v2.0 → v3.0", "intro": "Crucé tus dos artefactos de Google Workspace (los 10 módulos y las 17 láminas) con las 11 expectativas, las 12 promesas y el temario. Verifiqué en las fuentes de Google lo que más mueve la arquitectura: los Gems se reemplazan por skills y Workspace Studio ya está disponible desde Business Starter. Estos son los nueve cambios.", "items": [{"id": "c1", "t": "Los seis Gems pasan a ser skills (plan B: Gem)", "d": "Google lo anunció el 30 de septiembre de 2026. Los skills llegaron a Workspace el 5 de octubre y a la app de Gemini el 13 de octubre. El 17 de noviembre los Gems pasan a Configuración y en Business y Enterprise dejan de funcionar desde el 1 de marzo de 2027. Un skill es Markdown estándar (SKILL.md): el mismo archivo corre en Gemini ① y en Claude ②.", "tag": "P2 · P6 · E11"}, {"id": "c2", "t": "M8 se construye con Workspace Studio como ①; Make baja a ④", "d": "Studio arma agentes en lenguaje natural con disparador, pasos y variables (20 pasos por agente, 100 agentes por usuario). Se conecta con Salesforce. P7 se cumple sin salir de Google y Make se muestra 3 minutos como «lo mismo fuera de Google».", "tag": "P7 · E7 · E9"}, {"id": "c3", "t": "El flujo de 10 etapas es la columna vertebral", "d": "Viene de tu lámina «Armonización». M4 cubre Calificar, Preparar y Proponer. M5 cubre Atraer, Agendar, Descubrir y Fidelizar. M8 cubre las costuras y Medir. Cada ficha dice qué etapa deja resuelta.", "tag": "R1"}, {"id": "c4", "t": "Ruta Google asíncrona con tus 10 módulos", "d": "Se asignan como nivelación entre sesiones (unas 7 horas en total) y cierran con el examen de 30 preguntas y el certificado en M8·S4. Así el 80 % en Google no depende solo de las horas presenciales.", "tag": "R1"}, {"id": "c5", "t": "Herramientas de Google nuevas en las fichas", "d": "Son =AI() en Sheets, Forms con Gemini, páginas de reserva, combinación de correspondencia y bandejas múltiples, «Tomar notas por mí» en Meet, espacios de Chat con Tareas, firma electrónica, Vids, Gemini Notebook con Studio, Deep Research, Canvas y Looker Studio.", "tag": "E1 · E3 · E5 · E6 · P3 · P5"}, {"id": "c6", "t": "Comprobación de edición en el minuto 0 del 4 de noviembre", "d": "Cada participante marca si ve Gemini en Docs, Studio y Vids. Así el pendiente de la licencia se resuelve con datos del grupo. Business Standard es el piso para casi todo.", "tag": "⚠️ licencia"}, {"id": "c7", "t": "NotebookLM aparece como «Gemini Notebook (antes NotebookLM)»", "d": "Se renombró el 16 de julio de 2026. P4 se prometió con el nombre viejo.", "tag": "P4"}, {"id": "c8", "t": "Política mínima de uso de IA en el cierre del M8", "d": "Incluye borradores antes que envíos, consentimiento para grabar (Ley 1581) y revisión trimestral de lo compartido fuera. Viene de tu módulo 10 y es lo que TI necesita para autorizar agentes.", "tag": "Regla 6"}, {"id": "c9", "t": "No se promete AI Inbox de Gmail", "d": "Por ahora solo está en EE. UU. y en inglés. En su lugar se usan bandejas múltiples (tu módulo 3).", "tag": "E3"}], "preguntas": [{"id": "q1", "t": "P2 prometía un «Gem Super Prompt». ¿Cómo lo cumplimos el 6 de noviembre?", "ops": ["Como skill, diciendo en voz alta por qué cambió, con el Gem como plan B (recomendado)", "Como Gem, tal como se prometió, y la migración a skill queda para el M8", "Los dos en vivo: primero el Gem y luego el mismo texto como skill"], "rec": 0}, {"id": "q2", "t": "P7 prometía automatizaciones con Make. ¿Qué peso le damos a Make?", "ops": ["Studio ① y Make ④ en 3 minutos, como «lo mismo fuera de Google» (recomendado)", "Studio ① y Make en un tramo propio de 20 minutos", "Solo Studio; Make sale de la arquitectura"], "rec": 0}], "tabla": null}, {"id": "paso2", "titulo": "Reglas y flujo", "sub": "Capas que valen para las 9 sesiones", "intro": "Pasan de cuatro a seis reglas: se suman el peldaño más bajo y «la IA redacta, la persona decide». Las dos vienen de tu entrenamiento.", "items": [{"id": "r1", "t": "1 · Todo tema termina en IA", "d": "El orden es concepto → «así se hace con IA» → «ahora hazlo tú». Ningún tramo se queda en teoría.", "tag": ""}, {"id": "r2", "t": "2 · Orden fijo ① Google → ② Claude → ③ ChatGPT → ④ el resto", "d": "Las rutas ②, ③ y ④ van como alternativa de 1 a 3 minutos o solo en la guía. El diseño apunta a 85–90 % del tiempo en Google.", "tag": ""}, {"id": "r3", "t": "3 · Compromiso nombrado", "d": "En la lámina: «Lo pidieron N de ustedes el 28 de octubre». Los nombres van solo en la guía.", "tag": ""}, {"id": "r4", "t": "4 · Una línea, tres módulos", "d": "M4 aporta datos y cálculo. M5 aporta atracción y seguimiento siempre activos. M8 aporta agentes medidos en horas recuperadas.", "tag": ""}, {"id": "r5", "t": "5 · Peldaño más bajo (nueva)", "d": "El orden es pregunta → skill → agente de Studio → AppSheet → Apps Script → Gemini Enterprise. No se construye un agente donde basta un skill.", "tag": ""}, {"id": "r6", "t": "6 · La IA redacta, la persona decide (nueva)", "d": "Todo agente que escribe a un cliente empieza dejando borradores. Para grabar se pide permiso. Las cifras de la IA se contrastan.", "tag": ""}, {"id": "r7", "t": "Flujo de 10 etapas repartido por sesión", "d": "1 Atraer: M5·S2, S3 · 2 Calificar: M4·S2, M5·S2 · 3 Agendar: M5·S2 · 4 Preparar: M4·S3, M5·S1, S3 · 5 Descubrir: M5·S1, M8·S3 · 6 Proponer: M4·S2, S3, M5·S3 · 7 Negociar: M5·S2 · 8 Cerrar: M5·S3 · 9 Fidelizar: M5·S1, M8·S3 · 10 Medir: M8·S1, S4.", "tag": ""}, {"id": "r8", "t": "Privacidad", "d": "Nada de nombres en pantalla y evaluación solo en agregado. Las herramientas ④ se usan con el caso tipo. Los datos reales van en Gemini corporativo. Meet graba solo con autorización expresa.", "tag": ""}], "preguntas": [{"id": "q3", "t": "¿Qué meta de tiempo en Google fijamos?", "ops": ["85–90 % (recomendado; la Ruta asíncrona lo permite)", "80 %, como pidió Rocío", "Cerca del 100 %: Claude y ChatGPT solo en la guía"], "rec": 0}], "tabla": null}, {"id": "p const KEY = "rev-arq-v3";

let CLAVE=null; try{ CLAVE=localStorage.getItem(KEY+"-clave"); if(!CLAVE){ CLAVE=(crypto.randomUUID?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16))); localStorage.setItem(KEY+"-clave",CLAVE);} }catch(e){}
let db = null, docRef = null, tGuardar = null;
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const totalItems = () => PASOS.reduce((a,p)=>a+p.items.length+p.preguntas.length,0);
function revisadosPaso(p){ return p.items.filter(i=>S.items[i.id]&&S.items[i.id].v).length + p.preguntas.filter(q=>S.preg[q.id]&&S.preg[q.id].v!=null).length; }
function totalPaso(p){ return p.items.length + p.preguntas.length; }

function guardar(){
  S.actualizado = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(tGuardar);
  $("#guard").textContent = "Guardando…";
  tGuardar = setTimeout(async ()=>{
    if(!docRef){
      try{
        const r = await fetch(SB_URL+"/rest/v1/rpc/arq_guardar_revision",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_pieza:PIEZA,p_clave:CLAVE,p_revisor:S.revisor||null,p_estado:S})});
        $("#guard").textContent = r.ok ? "Guardado · "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}) : "Guardado en este navegador · usa «Copiar mis respuestas»";
      }catch(e){ $("#guard").textContent = "Guardado en este navegador · usa «Copiar mis respuestas»"; }
      return;
    }
    try{ await docRef.set(JSON.parse(JSON.stringify(S))); $("#guard").textContent = "Guardado · "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}); }
    catch(e){ $("#guard").textContent = "No se pudo guardar en la nube; queda en este navegador"; }
  }, 700);
  cabecera(); navegacion();
}

function cabecera(){
  const t = totalItems(), r = PASOS.reduce((a,p)=>a+revisadosPaso(p),0);
  $("#progTxt").textContent = r+" de "+t+" revisados";
  $("#bar").style.width = (t? r*100/t : 0)+"%";
  const e = $("#estado");
  e.className = "estado";
  if(S.decision==="apruebo"){ e.textContent="Aprobada"; e.classList.add("ap"); }
  else if(S.decision==="ajustes"){ e.textContent="Ajustes pedidos"; e.classList.add("aj"); }
  else if(S.decision==="volver"){ e.textContent="Volver a la v2.0"; e.classList.add("aj"); }
  else e.textContent = "Pendiente de revisión";
}

function actual(){ const h = location.hash.replace("#",""); return PASOS.find(p=>p.id===h) ? h : "paso1"; }

function navegacion(){
  const on = actual();

    return `<button class="${cls} ${p.id===on?'on':''}" data-go="${p.id}"><span class="n">${cls==="done"?"✓":i+1}</span><span class="lb">${esc(p.titulo)}<small>${esc(p.nombre||p.sub)}</small></span>${t?`<span class="c">${r}/${t}</span>`:""}</button>`;
  }).join("");
}

  return `<div class="item ${st.v==='ok'?'ok':st.v==='ajustar'?'aj':''}">
    <h3>${esc(i.t)}</h3><p>${esc(i.d)}</p>${i.tag?`<span class="tag">${esc(i.tag)}</span>`:""}
    <div class="ctl"><button class="ch ${st.v==='ok'?'okon':''}" data-it="${i.id}" data-v="ok">✓ OK</button><button class="ch ${st.v==='ajustar'?'ajon':''}" data-it="${i.id}" data-v="ajustar">✎ Ajustar</button></div>
    ${st.v==='ajustar' || st.n ? `<textarea data-nota="${i.id}" placeholder="¿Qué cambio, qué quito o qué agrego?">${esc(st.n||"")}</textarea>` : ""}
  </div>`;
}

function vistaPreg(q){
  const st = S.preg[q.id] || {};
  return `<div class="preg"><div class="eb">Pregunta para ti</div><h3>${esc(q.t)}</h3>
    ${q.ops.map((o,k)=>`<button class="op ${st.v===k?'on':''}" data-pq="${q.id}" data-k="${k}">${esc(o)}</button>`).join("")}
    <textarea data-pn="${q.id}" placeholder="Otra opción o comentario (opcional)">${esc(st.n||"")}</textarea></div>`;
}

function resumen(){
  const aj = [];
  PASOS.forEach(p=>p.items.forEach(i=>{ const s=S.items[i.id]; if(s&&s.v==="ajustar") aj.push(`<li><b>${esc(p.titulo)}</b> · ${esc(i.t)}${s.n?` — ${esc(s.n)}`:""}</li>`); }));
  const pr = [];
  PASOS.forEach(p=>p.preguntas.forEach(q=>{ const s=S.preg[q.id]; pr.push(`<li>${esc(q.t)} → <b>${s&&s.v!=null?esc(q.ops[s.v]):"sin responder"}</b>${s&&s.n?` — ${esc(s.n)}`:""}</li>`); }));
  const sin = totalItems() - PASOS.reduce((a,p)=>a+revisadosPaso(p),0);
  return `<div class="res"><h3>Ajustes que pediste (${aj.length})</h3>${aj.length?`<ul>${aj.join("")}</ul>`:"<p>Ninguno por ahora.</p>"}</div>
  <div class="res"><h3>Tus respuestas</h3><ul>${pr.join("")}</ul></div>
  ${sin?`<div class="res"><p>Quedan <b>${sin}</b> puntos sin marcar. Puedes decidir igual; los que no marques los tomo como OK.</p></div>`:""}`;
}

function pintar(){
  const id = actual(), i = PASOS.findIndex(p=>p.id===id), p = PASOS[i];
  let h = `<div class="sub">${esc(p.sub)}</div><h2>${esc(p.titulo)}</h2>${p.nombre?`<div class="nombre">${esc(p.nombre)}</div>`:""}<p class="intro">${esc(p.intro)}</p>`;
  if(p.items.length) h += `<div class="acc"><button class="btn" data-todo="${p.id}">Marcar todas como OK</button></div>` + p.items.map(vistaItem).join("");
  h += p.preguntas.map(vistaPreg).join("");
  if(p.id==="paso16"){
    const D = [["apruebo","Apruebo","Construyo M4·S2 con esta arquitectura y los ajustes que marcaste."],["ajustes","Pido ajustes","Hago la v3.1 con tus notas y te la vuelvo a subir aquí."],["volver","Volver a la propuesta inicial","Retomo la v2.0 (con Gems y Make) y solo aplico lo que marcaste."]];
    h += `<div class="dec">${D.map(d=>`<button class="${S.decision===d[0]?'on':''}" data-dec="${d[0]}"><b>${d[1]}</b>${d[2]}</button>`).join("")}</div>
      <textarea id="notaFinal" placeholder="Algo más que quieras sumar a la arquitectura">${esc(S.notaFinal)}</textarea>` + resumen();
  }
  h += `<div class="nav2">${i>0?`<button class="btn" data-go="${PASOS[i-1].id}">← ${esc(PASOS[i-1].titulo)}</button>`:"<span></span>"}${i<PASOS.length-1?`<button class="btn pri" data-go="${PASOS[i+1].id}">${esc(PASOS[i+1].titulo)} →</button>`:""}</div>`;
  $("#main").innerHTML = h;
  navegacion(); cabecera();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.go){ location.hash = b.dataset.go; window.scrollTo(0,0); return; }
  if(b.dataset.it){ const s = S.items[b.dataset.it] || (S.items[b.dataset.it]={}); s.v = s.v===b.dataset.v ? null : b.dataset.v; guardar(); pintar(); return; }
  if(b.dataset.todo){ const p = PASOS.find(x=>x.id===b.dataset.todo); p.items.forEach(i=>{ const s = S.items[i.id] || (S.items[i.id]={}); if(!s.v) s.v="ok"; }); guardar(); pintar(); return; }
  if(b.dataset.pq){ const s = S.preg[b.dataset.pq] || (S.preg[b.dataset.pq]={}); const k=+b.dataset.k; s.v = s.v===k ? null : k; guardar(); pintar(); return; }
  if(b.dataset.dec){ S.decision = S.decision===b.dataset.dec ? null : b.dataset.dec; guardar(); pintar(); return; }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.nota){ (S.items[t.dataset.nota] || (S.items[t.dataset.nota]={})).n = t.value; guardar(); }
  else if(t.dataset.pn){ (S.preg[t.dataset.pn] || (S.preg[t.dataset.pn]={})).n = t.value; guardar(); }
  else if(t.id==="notaFinal"){ S.notaFinal = t.value; guardar(); }
});
function textoRespuestas(){
  const L=["Revisión de arquitectura v3 · Casalimpia M4-M5-M8","Revisor: "+(S.revisor||"(sin nombre)"),"Decisión: "+({apruebo:"Apruebo",ajustes:"Pido ajustes",volver:"Volver a la propuesta inicial"}[S.decision]||"sin decidir"),""];
  PASOS.forEach(p=>{ const a=[];
    p.items.forEach(i=>{ const s=S.items[i.id]; if(s&&(s.v==="ajustar"||s.n)) a.push("  ✎ "+i.t+(s.n?" — "+s.n:"")); });
    p.preguntas.forEach(q=>{ const s=S.preg[q.id]; if(s&&(s.v!=null||s.n)) a.push("  ? "+q.t+" → "+(s.v!=null?q.ops[s.v]:"")+(s.n?" — "+s.n:"")); });
    const r=revisadosPaso(p), tt=totalPaso(p);
    if(a.length||tt) L.push(p.titulo+(p.nombre?" "+p.nombre:"")+" · "+r+"/"+tt+" revisados", ...a);
  });
  if(S.notaFinal) L.push("","Nota final: "+S.notaFinal);
  return L.join("\n");
}
document.getElementById("copiar").addEventListener("click", async ()=>{
  try{ await navigator.clipboard.writeText(textoRespuestas()); $("#guard").textContent="Copiado: pégalo en el chat con Claude"; }
  catch(e){ $("#guard").textContent="No se pudo copiar"; }
});
const inpR=document.getElementById("revisor"); inpR.value=S.revisor||""; inpR.addEventListener("input",()=>{ S.revisor=inpR.value; guardar(); });
window.addEventListener("hashchange", pintar);
pintar();
$("#guard").textContent = "Guardado solo en este navegador";

(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if(!db) return;
    docRef = db.doc("revision/jorge");
    const snap = await docRef.get();
    const nube = snap && (typeof snap.data==="function" ? snap.data() : snap);
    if(nube && nube.actualizado && (!S.actualizado || nube.actualizado > S.actualizado)){ S = Object.assign({items:{},preg:{},decision:null,notaFinal:""}, nube); pintar(); }
    $("#guard").textContent = "Conectado · se guarda en la nube";
    if(S.actualizado && (!nube || !nube.actualizado || S.actualizado > nube.actualizado)) guardar();
  }catch(e){ $("#guard").textContent = "Guardado solo en este navegador"; }
})();
</script>
</body>
</html>
